[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ronin-cli"
version = "0.1.0"
description = "A powerful agentic AI coding assistant"
readme = "readme.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "duckduckgo-search>=5.0.0"
]

[tool.setuptools]
py-modules = ["agent", "cli", "prompts", "router", "tools"]

[project.scripts]
ronin = "cli:main"
